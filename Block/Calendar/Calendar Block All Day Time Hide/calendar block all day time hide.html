  <style>
  
    .yui3-squarespacecalendar .twc-cbadth .item-time,
    .yui3-squarespacecalendar .twc-cbadth .flyoutitem-datetime
    
      {
      
        display : none;
        
        }
        
    </style>
    
  <script>
  
    ( ( ) => {
    
      // debugger;
      
      const
      
        title = 'Calendar Block All Day Time Hide',
        
        version = '0.2.0',
        
        s = `${ title } v${ version }
        
          License < https://tinyurl.com/s872fb68 >
          
          © 2025-2026 Thomas Creedon
          
          Tom's Web Consulting < http://www.tomsWeb.consulting >`
          
          .replace ( /^\s+/gm, '' );
          
      console.log ( s );
      
      // initialize twc module
      
      window.twc = window.twc || { };
      
      // initialize twc cboc sub-module
      
      twc.cboc = twc.cboc || { };
      
      // initialize twc cboc callbacks sub-module
      
      twc.cboc.callbacks = ( ( self ) => {
      
        const
        
          codeKey = 'twc-cbadth';
          
          xPathEvaluate =
          
            ( xPathExpression, contextNode ) => {
            
              const xPathResults = document
              
                .evaluate (
                
                  xPathExpression,
                  
                  contextNode,
                  
                  null,
                  
                  XPathResult.ORDERED_NODE_SNAPSHOT_TYPE,
                  
                  null
                  
                  );
                  
              return xPathResults;
              
              },
              
          xPathExpression = `
          
            .//div[
            
              contains (
              
                concat (
                
                  ' ',
                  
                  normalize-space ( @class ),
                  
                  ' '
                  
                  ),
                  
                ' flyoutitem-datetime--24hr '
                
                )
                
              and 
              
              normalize-space ( text ( ) )
              
              =
              
              '00:00 – 23:59'
              
              ]
              
            `;
            
          callback = ( element, type ) => {
          
            const isFlyout = type === 'flyout';
            
            // bail if not flyout
            
            if ( ! isFlyout ) return;
            
            const xPathResults =
            
              xPathEvaluate (
                
                xPathExpression,
                
                element
                
                );
                
            for (
            
              let i = 0;
              
              i
              
              <
              
              xPathResults.snapshotLength;
              
              i++
              
              )
              
              xPathResults
              
                .snapshotItem ( i )
                
                .closest ( 'td' )
                
                .classList
                
                .add ( codeKey );
                
            };
            
        self.push ( callback );
        
        return self;
        
        } ) ( twc.cboc.callbacks || [ ] );
        
      } ) ( );
  
    </script>
    
  <!-- end TWC Calendar Block All Day Time Hide -->

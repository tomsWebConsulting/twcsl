  <style>
  
    html:not( .squarespace-damask ) {
    
      .yui3-calendarnav-nextmonth:nth-last-of-type( 1 ),
      .yui3-calendarnav-prevmonth:nth-of-type( 1 ),
      .yui3-calendar-row
      
        {
        
          display : none;
          
          }
          
      }
      
    </style>
    
  <script>
  
    ( ( ) => {
    
      // debugger;
      
      const
      
        title = 'Calendar Block Week at a Time',
        
        version = '0.2.1',
        
        s = `${ title } v${ version }
        
          License < https://tinyurl.com/s872fb68 >
          
          © 2021-2026 Thomas Creedon
          
          Tom's Web Consulting < http://www.tomsWeb.consulting >`
          
          .replace ( /^\s+/gm, '' );
          
      console.log ( s );
      
      const isEditMode = window.frameElement;
        
      // bail if edit mode
      
      if ( isEditMode ) return;
      
      // initialize twc module
      
      window.twc = window.twc || { };
      
      // initialize twc cboc sub-module
      
      twc.cboc = twc.cboc || { };
      
      // initialize twc cboc callbacks sub-module
      
      twc.cboc.callbacks = ( ( self ) => {
      
        const
        
          codeKey = 'twc-cbwaat';
          
          imageDisplayForce = element => {
          
            // bail if no element
            
            // if ( ! element ) return;
            
            Y
            
              .one ( element )
              
              .simulate ( 'resize' );
              
            };
            
          pseudos = {
          
            next : {
            
              calendarRow : 'first-child',
              
              navigation : 'last-child'
              
              },
              
            prev : {
            
              calendarRow : 'last-child',
              
              navigation : 'first-child'
              
              }
              
            },
            
          monthChange = (
          
            direction,
            
            blockCalendarElement,
            
            headerElement
            
            ) => {
            
              Y
              
                .one (
                
                  headerElement
                  
                    .querySelector (
                    
                      `.yui3-calendarnav-${
                      
                        direction
                        
                        }month:${
                        
                          pseudos
                          
                            [ direction ]
                            
                            .navigation
                            
                          }`
                          
                      )
                      
                  )
                  
                .simulate ( 'click' );
                
              },
              
          weekChange = (
          
            event,
            
            direction,
            
            blockCalendarElement,
            
            headerElement
            
            ) => {
              
              let weekElement =
              
                [
                
                  ...
                  
                  blockCalendarElement
                  
                    .querySelectorAll (
                    
                      '.yui3-calendar-row'
                      
                      )
                      
                  ]
                  
                .filter ( e => {
                
                  const has = e
                  
                    .style
                    
                    .display
                    
                    ===
                    
                    'table-row';
                  
                  if ( has ) return true;
                  
                  } )
                  
                [ 0 ];
                
              weekElement
              
                .style
                
                .display
                
                =
                
                '';
                
              switch ( direction ) {
              
                case 'next' :
                
                  weekElement = weekElement
                  
                    .nextElementSibling;
                  
                  break;
                  
                case 'prev' :
                
                  weekElement = weekElement
                  
                    .previousElementSibling;
                    
                  break;
                  
                }
                
              let isMonthChange = false;
              
              if ( ! weekElement )
              
                isMonthChange = true;
                
                else {
                
                  const hasMarker =
                  
                    weekElement
                    
                      .querySelector (
                      
                        '.marker'
                        
                        );
                        
                  if ( ! hasMarker )
                  
                    isMonthChange = true;
                    
                  }
                  
              if ( isMonthChange ) {
              
                monthChange (
                
                  direction,
                  
                  blockCalendarElement,
                  
                  headerElement
                  
                  );
                  
                weekElement = [
                
                  ...
                  
                  blockCalendarElement
                  
                    .querySelectorAll (
                    
                      '.yui3-calendar-row'
                      
                      )
                      
                  ]
                  
                  .filter ( e =>
                  
                    e.querySelector (
                    
                      '.marker'
                      
                      )
                      
                    );
                    
                switch ( direction ) {
                
                  case 'next' :
                  
                    weekElement = weekElement
                    
                      [ 0 ];
                      
                    break;
                    
                  case 'prev' :
                  
                    weekElement = weekElement
                    
                      .slice ( -1 )
                      
                      [ 0 ];
                      
                    break;
                    
                  }
                  
                }
                
              weekElement
              
                .style
                
                .display
                
                =
                
                'table-row';
                
              imageDisplayForce (
              
                weekElement
                
                );
                
              },
              
          callback = ( element, type ) => {
          
            const isConnected = element
            
              .isConnected;
              
            // bail if not connected
            
            if ( ! isConnected ) return;
            
            const isType = type === 'marker';
            
            // bail if not type
            
            if ( ! isType ) return;
            
            const
            
              blockCalendarElement =
              
                element.closest (
                
                  '.sqs-block-calendar'
                  
                  ),
                  
              property =
              
                `${ codeKey }-today-seen`,
                
              isTodaySeen = Object.hasOwn (
              
                blockCalendarElement,
                
                property
                
                );
                  
            // bail if today seen
            
            if ( isTodaySeen ) return;
            
            const isToday = element
            
              .closest ( 'td' )
              
              ?.classList
              
              .contains ( 'today' );
              
            // bail if not today
            
            if ( ! isToday ) return;
            
            element =
            
              element.closest ( 'tr' );
              
            // bail if no element
            
            if ( ! element ) return;
            
            const headerElement =
            
              blockCalendarElement
              
                .querySelector (
                
                  '.yui3-calendar-header'
                     
                  );
                  
            element
            
              .style
              
              .display
              
              =
              
              'table-row';
              
            imageDisplayForce ( element );
            
            // week navigation
            
            [
            
              'next',
              
              'prev'
              
              ]
              
              .forEach ( d => {
              
                const
                
                  element =
                  
                    blockCalendarElement
                    
                      .querySelector (
                      
                        `.yui3-calendarnav-${
                        
                          d
                          
                          }month`
                          
                        ),
                        
                  elementClone = element
                  
                    .cloneNode ( true );
                    
                delete elementClone.id;
                
                elementClone
                
                  .setAttribute (
                  
                    'aria-label',
                    
                    elementClone
                    
                      .getAttribute (
                      
                        'aria-label'
                        
                        )
                      
                      .replace (
                      
                        'month',
                        
                        'week'
                        
                        )
                        
                    );
                    
                elementClone
                
                  .setAttribute (
                  
                    `data-${ codeKey }`,
                    
                    ''
                    
                    );
                    
                elementClone
                
                  .addEventListener (
                  
                    'click',
                    
                    event => weekChange (
                    
                      event,
                      
                      d,
                      
                      blockCalendarElement,
                      
                      headerElement
                      
                      )
                    
                    );
                    
                let where;
                
                switch ( d ) {
                
                  case 'next' :
                  
                    where = 'beforebegin';
                    
                    break;
                    
                  case 'prev' :
                  
                    where = 'afterend';
                    
                    break;
                    
                  }
                  
                element
                
                  .insertAdjacentElement (
                  
                    where,
                    
                    elementClone
                    
                    );
                
                } );
                
            blockCalendarElement [ property ] =
            
              undefined;
              
            };
            
        self.push ( callback );
        
        return self;
        
        } ) ( twc.cboc.callbacks || [ ] );
        
      } ) ( );
  
    </script>
    
  <!-- end TWC Calendar Block Week at a Time -->

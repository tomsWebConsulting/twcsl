  <style>
  
    body:not( .sqs-is-page-editing ) {
    
      #siteWrapper {
      
        --twc-div-data-sqsp-block-form : hidden;
        
        }
        
      div[ data-sqsp-block = "form" ] {
      
        visibility : var( --twc-div-data-sqsp-block-form );
        
        }
        
      .section.twc-fbfeaw {
      
        display : none;
        
        }
        
      }
      
    </style>
    
  <script>
  
    ( ( ) => {
    
      // debugger;
      
      const
      
        title = 'Form Block Form Element Add Watch',
        
        version = '0.6.1',
        
        s = `
        
          ${ title } v${ version }
          
          License < https://tinyurl.com/s872fb68 >
          
          © 2023-2026 Thomas Creedon
          
          Tom's Web Consulting < http://www.tomsWeb.consulting >
          
          `
          
          .replace ( /^\s+/gm, '' );
          
      console.log ( s );
      
      // global
      
      {
      
        // initialize twc module
        
        window.twc = window.twc || { };
          
        // initialize twc fbfeaw sub-module
        
        twc.fbfeaw = twc.fbfeaw || { };
          
        // initialize twc fbfeaw callbacks sub-module
        
        twc.fbfeaw.callbacks =
        
          twc.fbfeaw.callbacks || { };
          
        }
        
      const
      
        codeKey = 'twc-fbfeaw',
        
        selectorKey =
        
          'div[ data-sqsp-block = "form" ]';
          
      // hide show register
      
      {
      
        // initialize twc data sub-module
        
        twc.data = twc.data || { };
          
        // initialize twc data hideShow sub-module
        
        twc.data.hideShow =
        
          twc.data.hideShow || { };
          
        // initialize twc data hideShow selector key sub-module
        
        twc.data.hideShow [ selectorKey ] =
        
          ( ( self ) => self )
          
          (
          
            twc.data.hideShow [ selectorKey ]
            
            ||
            
            [ ]
            
            );
            
        twc
        
          .data
          
          .hideShow
          
          [ selectorKey ]
          
          .push ( `--${ codeKey }` );
          
        }
        
      const
      
        fbwocCodeKey = 'twc-fbwoc',
        
        fbwocOptions = fbwocCodeKey
        
          .split ( '-' )
          
          .reduce (
          
            ( obj, key ) => obj?.[ key ],
            
            window
            
            ),
            
        options = codeKey
        
          .split ( '-' )
          
          .reduce (
          
            ( obj, key ) => obj?.[ key ],
            
            window
            
            ),
            
        userCallback =
        
          ( callback, node ) => {
          
            try {
            
              options
              
                .callbacks
                
                [ callback ]
                
                ( node );
                
              } catch ( error ) {
              
                const s =
                
                  `${
                  
                    codeKey
                    
                    } callback ${
                    
                    callback
                    
                    } error : `;
                    
                console.error ( s, error );
                
                }
                
            },
            
        xPathEvaluate = (
        
          xPathExpression,
          
          contextNode
          
          ) => {
          
            const xPathResults = document
            
              .evaluate (
              
                xPathExpression,
                
                contextNode,
                
                null,
                
                XPathResult
                
                  .ORDERED_NODE_SNAPSHOT_TYPE,
                  
                null
                
                );
                
            return xPathResults;
            
            },
            
        xPathExpression = `
        
          //div [
          
            contains (
            
              concat (
              
                ' ',
                
                normalize-space ( @class ),
                
                ' '
                
                ),
                
              ' title '
              
              )
              
              and
              
              (
              
                contains (
                
                  .,
                  
                  '${ codeKey }'
                  
                  )
                  
                or
                
                contains (
                
                  .,
                  
                  '${ fbwocCodeKey }'
                  
                  )
                  
                )
                
            ]
            
            /following-sibling::div [
            
              contains (
              
                concat (
                
                  ' ',
                  
                  normalize-space ( @class ),
                  
                  ' '
                  
                  ),
                  
                ' description '
                
                )
                
                and
                
                contains (
                
                  .,
                  
                  'callbacks'
                  
                  )
                  
                ]
                
          `,
          
        nodeCallback = ( node ) => {
        
          const isForm =
          
            node.tagName === 'FORM';
            
          // continue if not form element
          
          if ( ! isForm ) return;
          
          const
          
            xPathResults =
            
              xPathEvaluate (
              
                xPathExpression,
                
                node
                
                );
                
          // bail if no element
          
          if ( ! xPathResults.snapshotLength )
          
            return;
            
          const
          
            descriptionElement = xPathResults
            
              .snapshotItem ( 0 );
              
            id = descriptionElement
            
              .closest (
              
                'div[ data-sqsp-block = "form" ]'
                
                )
                
              .getAttribute ( 'id' );
              
          let userCallbacks;
          
          try {
          
            userCallbacks = JSON
            
              .parse (
            
                descriptionElement
                
                  .textContent
                  
                  .match (
                  
                    /"callbacks"\s*:\s*(.+)/s
                    
                    )
                    
                  [ 1 ]
                  
                  // remove * comments
                  
                  .replace (
                  
                    /\/\*[^]*?\*\//g,
                    
                    ''
                    
                    )
                    
                  // remove // comments
                  
                  .replace (
                  
                    /^\s*\/\/.*/gm,
                    
                    ''
                    
                    )
                    
                  // remove trailing ,
                  
                  .replace ( /,\s+]/g, ']' )
                  
                );
                
            } catch ( error ) {
            
              const s = `${
              
                codeKey
                
                }, id ${
                
                  id
                  
                  }, `
              
                +
                
                'callbacks parse error : ';
                
              console.error ( s, error );
              
              return;
              
              }
              
          descriptionElement
          
            .closest ( '.form-item' )
            
            .classList
            
            .add ( codeKey );
            
          // process user callbacks
          
          {
          
            if ( userCallbacks.added )
            
              userCallbacks =
              
                userCallbacks.added;
                
            // filter
            
            userCallbacks = userCallbacks
            
              .filter (
              
                e => e [ 0 ] !== '['
                
                );
                
            // call user callbacks
            
            for ( const c of userCallbacks )
            
              userCallback ( c, node );
              
            }
            
          },
          
        mutationCallback = ( mutation ) => {
        
          // bail if no added nodes
          
          if ( ! mutation.addedNodes.length )
          
            return;
            
          mutation
          
            .addedNodes
            
            .forEach ( nodeCallback );
            
          },
          
        mutationsCallback = ( mutations ) => {
        
          const isEditing = document
          
            .body
            
            .classList
            
            .contains ( 'sqs-is-page-editing' );
            
          // bail if editing
          
          if ( isEditing ) return;
          
          for ( const m of mutations )
          
            mutationCallback ( m );
            
          },
          
        domContentLoadedCallback =
        
          ( ) => {
          
            // merge fbwoc callback into callbacks
            
            if ( fbwocOptions?.callbacks )
            
              Object.assign (
              
                options.callbacks,
                
                fbwocOptions.callbacks
                
                );
                
            // begin listening for changes in specified element
            
            new MutationObserver (
            
              mutationsCallback
              
              )
              
              .observe (
              
                document.body,
                
                {
                
                  childList : true,
                  
                  subtree : true
                  
                  }
                  
                );
                
            // hide show unregister
            
            {
            
              const siteWrapperElement = document
              
                .querySelector ( '#siteWrapper' );
                
              siteWrapperElement
              
                .style
                
                .setProperty (
                
                  `--${ codeKey }`, 'visible'
                  
                  );
                  
              twc
              
                .data
                
                .hideShow
                
                [ selectorKey ]
                
                .pop ( `--${ codeKey }` );
                
              const l = twc
              
                .data
                
                .hideShow
                
                [ selectorKey ]
                
                .length;
                
              if ( ! l )
              
                siteWrapperElement
                
                  .style
                  
                  .setProperty (
                  
                    '--twc-div-data-sqsp-block-form',
                    
                    'unset'
                    
                    );
                    
              }
              
            };
            
      document.addEventListener (
      
        'DOMContentLoaded',
        
        domContentLoadedCallback
        
        );
        
      } ) ( );
      
    </script>
    
  <!-- end TWC Form Block Form Element Add Watch -->

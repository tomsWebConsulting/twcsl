  <style>
  
    body:not( .sqs-is-page-editing ) {
    
      &.primary-button-shape-oval #siteWrapper.site-wrapper .twc-epldi .sqs-button-element--primary {
      
        --primary-button-padding-left : 0;
        --primary-button-padding-right : 0;
        --primary-button-padding-x : 0;
        
        }
        
      .twc-epldi a {
      
        display : flex;
        gap : 0.25em;
        justify-content : center;
        width : 100%;
        
        }
        
      }
      
    .twc-epldi .sqs-layout:not( .sqs-editing ) .sqs-row {
    
      & + .sqs-row .sqs-block:not( .float ):first-child {
      
        padding-top : 0;
        
        }
        
      .sqs-block:not( .float ):not( .sqs-feature-gated-wrapper ):first-child:last-child {
      
        padding-bottom : 17px;
        
        }
        
      }
      
    @media screen and ( min-width : 496px ) and ( max-width : 767px ) {
    
      .twc-epldi .sqs-layout > .sqs-row > .sqs-col-12 .sqs-row {
    
        display : grid;
        grid-template-columns : 1fr 1fr;
        
        }
    
      .sqs-row:after,
      .sqs-row:before
      
        {
        
          content : unset;
          display : unset;
          
          }
          
      }
      
    </style>
    
  <script>
  
    ( ( ) => {
    
      // debugger;
      
      const
      
        title = 'Events Page List Day Index',
        
        version = '0.2.3',
        
        s = `${ title } v${ version }
        
          License < https://tinyurl.com/s872fb68 >
          
          © 2025-2026 Thomas Creedon
          
          Tom's Web Consulting < http://www.tomsWeb.consulting >`
          
          .replace ( /^\s+/gm, '' );
          
      console.log ( s );
      
      let html = '';
      
      const
      
        codeKey = 'twc-epldi',
        
        context = Static.SQUARESPACE_CONTEXT,
        
        selector =
        
          `[ data-sqsp-block = "button" ] a[ href ^= "#${
          
            codeKey
            
            }" ] `,
            
        domContentLoadedCallback =
        
          ( ) => {
          
            const isEventsPage =
            
              !!
              
              document
              
                .querySelectorAll (
                
                  [
                  
                    'body[ class *= "collection-type-events-" ]',
                    
                    'body[ class ~= "collection-type-events" ]'
                    
                    ]
                    
                    .join ( ', ' )
                    
                  )
                  
                  .length;
                  
            // bail if not events page
            
            if ( ! isEventsPage ) return;
            
            const isList =
            
              ! context.item?.id;
              
            // bail if not list page
            
            if ( ! isList ) return;
            
            let element = document
            
              .querySelector ( selector );
              
            // const hasTrigger = element !== null;
            
            // bail if no element
            
            if ( ! element ) return;
            
            const
            
              elements = document
              
                .querySelectorAll (
                
                  '.twc-epldw'
                  
                  ),
                  
              days = elements.length;
              
            // bail if no day wrappers
            
            if ( ! days ) return;
            
            const
            
              dateOptions = JSON
              
                .parse (
                
                  element
                
                  .getAttribute ( 'href' )
                  
                  .split ( `#${ codeKey } ` )
                  
                  [ 1 ]
                  
                  .replace ( /\s*,\s*}$/, '}' )
                  
                  .replace (
                  
                    /\s*([\w]+)\s*:\s*([\w]+)\s*/g,
                    
                    '"$1":"$2"'
                    
                    )
                    
                  );
                
            element = element.closest (
            
              '.sqs-block-button'
              
              );
              
            const
            
              buttonColumns = Number (
              
                element
                
                  .parentElement
                  
                  .getAttribute ( 'class' )
                  
                  .match ( /sqs-col-(\d+)/ )
                  
                  [ 1 ]
                  
                ),
                
              buttonElement = element
              
                .cloneNode ( true ),
                
              buttonsPerRow =
              
                12 / buttonColumns,
                
              sectionCallback =
              
                ( element, index ) => {
                
                  let d = element
                  
                    .querySelector (
                    
                      '.eventlist-meta-date .event-date[ datetime ]'
                      
                      )
                      
                      .getAttribute ( 'datetime' )
                      
                      +
                      
                      'T00:00:00';
                      
                  const
                  
                    anchorElement =
                    
                      buttonElement
                      
                        .querySelector ( 'a' ),
                        
                    language = context
                    
                      .website
                      
                      .language,
                      
                    timeZone = context
                    
                      .website
                      
                      .timeZone,
                      
                    dateTimeFormatOptions = {
                    
                      timeZone : timeZone
                      
                      },
                      
                    longOffsetFormatter =
                    
                      new Intl.DateTimeFormat (
                      
                        language,
                        
                        {
                        
                          timeZone : timeZone,
                          
                          timeZoneName :
                          
                            'longOffset'
                            
                          }
                          
                        ),
                        
                    longOffsetString =
                    
                      longOffsetFormatter
                      
                        .format (
                        
                          new Date ( d )
                          
                          ),
                          
                    gmtOffset = longOffsetString
                    
                      .split ( 'GMT' )
                      
                      [ 1 ];
                      
                  Object.assign (
                  
                    dateTimeFormatOptions,
                    
                    dateOptions
                    
                    );
                    
                  // date html
                  
                  {
                  
                    d = new Date (
                    
                      `${ d }${ gmtOffset }`
                      
                      );
                      
                    d
                    
                      = 
                      
                      '<span>'
                      
                      +
                      
                      d
                      
                        .toLocaleDateString (
                        
                          language,
                          
                          dateTimeFormatOptions
                          
                          )
                          
                        .split ( ' ' )
                        
                        .join ( '</span><span>')
                        
                      +
                      
                      '</span>';
                      
                    }
                    
                  anchorElement.setAttribute (
                  
                    'href',
                    
                    `#${
                    
                      element
                      
                        .getAttribute ( 'id' )
                        
                      }`
                      
                    );
                    
                  anchorElement.innerHTML = d;
                  
                  if (
                  
                    index % buttonsPerRow === 0
                    
                    ) {
                    
                      // row close
                      
                      if ( index !== 0 )
                      
                        html += '</div>';
                        
                      // row open
                      
                      html +=
                      
                        '<div class = "row sqs-row">';
                        
                      }
                      
                  html += `
                  
                    <div class = "col sqs-col-${
                    
                      buttonColumns
                      
                      } span-${
                      
                        buttonColumns
                        
                        }">
                        
                      ${
                      
                        buttonElement
                      
                        .outerHTML
                        
                        }
                        
                      </div>
                      
                    `;
                    
                  };
                  
            element = element.closest (
            
              '.sqs-col-12'
              
              );
              
            element
            
              .closest ( '.page-section' )
              
              .classList
              
              .add ( codeKey );
              
            // set up button element for use as template
            
            {
            
              const attribute = 'id';
              
              buttonElement.removeAttribute (
              
                `${ attribute }`
                
                );
                
              buttonElement
              
                .querySelectorAll (
                
                  `[ ${ attribute } ]`
                  
                  )
                  
                .forEach ( e =>
                
                  e.removeAttribute (
                  
                    `${ attribute }`
                    
                    )
                    
                  );
                  
              }
              
            elements.forEach (
            
              sectionCallback
              
              );
              
            element
            
              .innerHTML
              
              =
              
              `${ html }</div>`;
              
            };
            
      document.addEventListener (
      
        'DOMContentLoaded',
        
        domContentLoadedCallback
        
        );
        
      } ) ( );
      
    </script>
    
  <!-- end TWC Events Page List Day Index -->

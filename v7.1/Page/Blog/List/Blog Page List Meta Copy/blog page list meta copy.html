  <style>
  
    .blog-masonry .blog-meta-section:nth-of-type( 2 ) {
    
      margin-top : 20px;
      order : 1;
      
      }
      
    </style>
    
  <script>
  
    ( ( ) => {
    
      // debugger;
      
      const isList =
      
        !
        
        Static
        
          .SQUARESPACE_CONTEXT
          
          .item
          
          ?.id;
          
      // bail if not list page
      
      if ( ! isList ) return;
      
      const
      
        forEachCallback = ( element ) => {
        
          const cloneElement = element
          
            .querySelector (
            
              '.blog-meta-section'
              
              )
              
            .cloneNode ( true );
            
          element
          
            .querySelector ( '.blog-title' )
            
            .after ( cloneElement );
            
          },
          
        selector = '.blog-masonry .entry';
        
        domContentLoadedCallback =
        
          ( ) => {
          
            const isBlogPage =
            
              !!
              
              document
              
                .querySelectorAll (
                
                  [
                  
                    'body[ class *= "collection-type-blog-" ]',
                    
                    'body[ class ~= "collection-type-blog" ]'
                    
                    ]
                    
                    .join ( ', ' )
                    
                  )
                  
                  .length;
                  
            // bail if not blog page
            
            if ( ! isBlogPage ) return;
            
            document
            
              .querySelectorAll (
              
                selector
                
                )
                
              .forEach ( forEachCallback );
              
            };
            
      // domContentLoadedCallback ( );
      
      //
      
      document.addEventListener (
      
        'DOMContentLoaded',
        
        domContentLoadedCallback
        
        );
        
      //
      
      } ) ( );
      
    </script>
    
  <!-- end TWC Blog Page List Meta Copy -->

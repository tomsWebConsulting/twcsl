    <script>
    
      ( ( ) => {
      
        const
        
          vendor = {
          
            text : '[ enter vendor text here between single quotes replacing square brackets ]',
            
            url : '[ enter vendor url here between single quotes replacing square brackets ]'
            
            },
            
          menuItem = {
          
            text : '[ enter menu item text here between single quotes replacing square brackets ]',

              productId,
              
              crumb
              
              ) => {

            url : '[ optional, enter menu item url here between single quotes replacing square brackets ]'
            
            };
            
        // initialize twc module
        
        window.twc = window.twc || { };
        
        // initialize twc sppppmia sub-module
        
        window.twc.sppppmia =
        
          window.twc.sppppmia || { };
          
        // initialize twc sppppmia vendor sub-module
        
        window
        
          .twc
          
          .sppppmia
          
          [ vendor.text ]
          
          =
        
          ( ( self ) => {
          
            const options = {
            
              url : vendor.url
              
              };
              
            Object
            
              .assign (
              
                self,
                
                options
                
                );
                
            return self;
            
            } )
            
          (
          
            window
            
              .twc
              
              .sppppmia
              
              [ vendor.text ]
              
            ||

            );
            
        // initialize twc sppppmia vendor menu item

  <script>
  
    ( ( ) => {
    
      // debugger;
      
      const
      
        codeKey = '[ enter your code key here between single quotes replacing square brackets ]',
        
        dcmnt = window.top.document,
        
        destinationElement =
        
          dcmnt.getElementById (
          
            `${ codeKey }`
            
            ),
            
        destinationVersion =
        
          destinationElement
          
            ?.dataset
          
            .version;
            
      let sourceElement = document
      
        .getElementById (
        
          `${ codeKey }`
          
          );
          
      const
      
        sourceVersion =
        
          sourceElement
          
            ?.dataset
            
            .version,
            
        isInstall =
        
          ! destinationElement
          
          ||
          
          destinationVersion
          
          !==
          
          sourceVersion;
          
      if ( isInstall ) {
      
        destinationElement?.remove ( );
        
        sourceElement = sourceElement
        
          .content
          
          .cloneNode ( true );
          
        sourceElement
        
          .firstElementChild
          
          .id
          
          =
          
          codeKey;
          
        sourceElement
        
          .firstElementChild
          
          .dataset
          
          .version
          
          =
          
          sourceVersion;
          
        dcmnt
        
          .head
          
          .appendChild ( sourceElement );
          
        }
        
      } ) ( );
      
    </script>

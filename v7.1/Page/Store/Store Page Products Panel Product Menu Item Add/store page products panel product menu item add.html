      <!--

      <template id="twc-sppppmia-template">
      
        <div id="twc-sppppmia">
        
          </div>
        
        </template>
        
      <template id="twc-sppppmia-template-vendor">

            <a target="_blank">
            
              [ vendor ]

      <template id="twc-sppppmia-template-menu-item">

              [ text ]
              
              </span>
              
            <a target="_blank">
            
              *
              
              </a>
              
            </li>
            
          </div>
          
        </template>
        
      <style id="twc-sppppmia-style">

          [ data-vendor ] {
          
            border-top : 1px solid rgba( 0, 0, 0, 0.25 );
            display : flex;
            flex-direction : column;
            
            a:first-child {

            color: rgb( 14, 14, 14 );

            flex-basis : 100%;
            font-family : Clarkson, "Helvetica Neue", Helvetica, Arial, sans-serif;

            font-weight : 500;

            line-height : 22px;
            list-style : none;
            padding : 11px 22px;
            position : relative;
            text-rendering : optimizelegibility;
            
            span {
            
              flex-basis : 100%;
              
              }

              border-bottom : unset;
              font-size : small;
              font-weight : normal;
              
              }
              
            }
            
          }
          
        </style>
        
      <script id="twc-sppppmia-script">
      
        ( ( ) => {
        
          // debugger;
          
          const isEditor = document
          
            .documentElement
            
            .classList
            
            .contains ( 'squarespace-damask' );
            
          // bail if not logged in
          
          if ( ! isEditor ) return;
          
          const isStorePage = document
          
            .querySelector (
            
              'iframe[ data-testid = '
              
              +
              
              '"sqs-site-frame" ]'
              
              )
              
            ?.contentWindow
            
            .Static
              
              .SQUARESPACE_CONTEXT
              
              .collection
              
              ?.type
              
              ===
              
              13;
              
          // bail if not store page
          
          if ( ! isStorePage ) return;
          
          const xPathEvaluate = (
          
            xPathExpression,
            
            contextNode
            
            ) => {
            
              const xPathResults = document
              
                .evaluate (
                
                  xPathExpression,
                  
                  contextNode,
                  
                  null,
                  
                  XPathResult
                  
                    .ORDERED_NODE_SNAPSHOT_TYPE,
                    
                  null
                  
                  );
                  
              return xPathResults;
              
              };
              
          let
          
            xPathExpression = `
            
              .//button [
              
                contains (
                
                  @data-test,
                  
                  "menuHeader-back"
                  
                  )
                  
                and
                
                contains (
                
                  .,
                  
                  "Categories"
                  
                  )
                  
                ]
                          
              `,
              
            xPathResults = xPathEvaluate (
            
              xPathExpression,
              
              document
              
              );
              
          // bail if no categories panel
          
          if ( ! xPathResults.snapshotLength )
          
            return;
            
          let productId;
          
          const
          
            codeKey = 'twc-sppppmia',
            
            fiberKeyGet = ( node ) => {
            
              const fiberKey = Object
              
                .keys ( node )
                
                .find (
                
                  k =>
                  
                    k.startsWith (
                    
                      '__reactFiber$'
                      
                      )
                      
                  );
                  
              return fiberKey;
              
              },
              
            getAncestor =
            
              ( element, levels ) => {
              
                // bail if no element
                
                if ( ! element ) return null;
                
                while (
                
                  element && levels > 0
                  
                  ) {
                  
                    element = element
                    
                      .parentElement;
                      
                    levels--;
                    
                    }
                    
                return element;
                
                },
                
            getCookieValue = ( key ) => {
            
              let v = '';
              
              try {
              
                v = document
                
                  .cookie
                  
                  .split ( '; ' )
                  
                  .find (
                  
                    row =>
                    
                      row.startsWith ( `${ key }=` )
                      
                    )
                    
                  .split ( '=' ) [ 1 ];
                  
                } catch ( error ) { }
                
              return v;
              
              },
              
            popoverClickHandler =
            
              ( event ) => {
              
                const
                
                  element = event
                  
                    .currentTarget
                    
                    .closest (
                    
                      '[ data-test = "product-item" ]'
                      
                      )
                      
                    .parentElement,
                    
                  fiberKey =
                  
                    fiberKeyGet ( element );
                    
                // bail if no react
                
                if ( ! fiberKey ) return;
                
                productId = element
                
                  [ fiberKey ]
                  
                  .memoizedProps
                  
                  .children
                  
                  .key;
                  
                // if ( ! productId ) return;
                
                },
                
            popoverTriggerSelector =
            
              '[ data-test = "list-item-popover-trigger" ]',
              
            crumb = getCookieValue ( 'crumb' ),
            
            gridInnerElement = document
            
              .querySelector (
              
                '.ReactVirtualized__Grid__innerScrollContainer'
                
                ),
                
            gridInnerMutationCallback =
            
              ( mutation ) => {
              
                let element = mutation
                
                  .addedNodes [ 0 ];
                  
                // bail if no element
                
                if ( ! element ) return;
                
                const productItemElement =
                
                  element.closest (
                  
                    '[ data-test = "product-item" ]'
                    
                    );
                    
                if ( productItemElement )
                
                  element =
                  
                    productItemElement
                    
                      .parentElement;
                      
                element
                
                  .querySelector (
                  
                    popoverTriggerSelector
                    
                    )
                    
                  ?.addEventListener (
                  
                    'click',
                    
                    popoverClickHandler
                    
                    );
                    
                },
                
            menuItemClickHandler = async (
            
              userCallback,
              
              event
              
              ) => {
              
                // bail if no productId
                
                if ( ! productId ) return;
                
                await userCallback (
                
                  productId,
                  
                  crumb
                  
                  );
                  
                getAncestor (
                
                  event
                  
                    .target
                    
                    .closest (
                    
                      '[ data-test = "list-item-popover" ]'
                      
                      ),
                      
                  5
                  
                  )
                  
                  .remove ( );
                  
                },
                
            menuItemsAdd =
            
              ( items, element ) => {
              
                for (
                
                  const [
                  
                    key,
                    
                    value
                    
                    ]
                    
                  of
                  
                  Object.entries ( items )
                  
                  ) {
                  
                    if ( key === 'url' )
                    
                      continue;
                      
                    const menuItemElement =
                    
                      document
                      
                        .getElementById (
                        
                          `${
                          
                            codeKey
                            
                            }-template-menu-item`
                            
                          )
                          
                        .content
                        
                        .cloneNode ( true );
                        
                    menuItemElement
                    
                      .querySelector (
                      
                        'li span'
                        
                        )
                        
                      .textContent
                      
                      =
                      
                      key;
                      
                    menuItemElement
                    
                      .querySelector (
                      
                        'li'
                        
                        )
                        
                      .addEventListener (
                      
                        'click',
                        
                        e => {
                        
                          menuItemClickHandler (
                          
                            value
                            
                              .productCallback,
                              
                            e
                            
                            )
                            
                          }
                          
                        );
                        
                    // anchor element
                    
                    {
                    
                      const
                      
                        anchorElement =
                        
                          menuItemElement
                          
                            .querySelector (
                            
                              'a'
                              
                              ),
                              
                        hasUrl =
                        
                          value.url [ 0 ]
                          
                          !==
                          
                          '[';
                           
                      if ( hasUrl )
                      
                        menuItemElement
                        
                          .querySelector (
                          
                            'a'
                            
                            )
                            
                          .setAttribute (
                          
                            'href',
                            
                            value.url
                            
                            );
                            
                        else
                        
                          anchorElement
                          
                            .remove ( );
                            
                      }
                      
                    element.appendChild (
                    
                      menuItemElement
                      
                      );
                      
                    }
                    
                },
                
            vendorAdd = (
            
              vendor,
              
              menuItems,
              
              element
              
              ) => {
              
                const vendorElement =
                
                  document
                  
                    .getElementById (
                    
                      `${
                      
                        codeKey
                        
                        }-template-vendor`
                        
                      )
                      
                    .content
                    
                    .cloneNode ( true );
                    
                vendorElement
                
                  .querySelector (
                  
                    '[ data-vendor ]'
                    
                    )
                    
                  .setAttribute (
                  
                    'data-vendor',
                    
                    vendor
                    
                    );
                    
                vendorElement
                
                  .querySelector (
                  
                    'a'
                    
                    )
                    
                  .setAttribute (
                  
                    'href',
                    
                    menuItems.url
                    
                    );
                    
                vendorElement
                
                  .querySelector ( 'a' )
                  
                  .textContent
                  
                  =
                  
                  vendor;
                  
                element.appendChild (
                
                  vendorElement
                  
                  );
                  
                menuItemsAdd (
                
                  menuItems,
                  
                  element.querySelector (
                  
                    `[ data-vendor = "${
                    
                      vendor
                      
                      }" ]`
                      
                    )
                    
                  );
                  
                },
                
            bodyMutationCallback =
            
              ( mutation ) => {
              
                let element =
                
                  mutation.addedNodes [ 0 ];
                  
                // bail if no element
                
                if ( ! element ) return;
                
                element = element
                
                  .querySelector (
                  
                    '[ data-test = "list-item-popover" ]'
                    
                    );
                    
                // bail if no element
                
                if ( ! element ) return;
                
                const options = codeKey
                
                  .split ( '-' )
                  
                  .reduce (
                  
                    ( obj, key ) => obj?.[ key ],
                    
                    window
                    
                    );
                    
                element
                
                  .appendChild (
                  
                    document
                    
                      .getElementById (
                      
                        `${
                        
                          codeKey
                          
                          }-template`
                          
                        )
                        
                      .content
                      
                      .cloneNode ( true )
                      
                    );
                    
                element =
                
                  document.getElementById (
                  
                    codeKey
                    
                    );
                    
                for (
                
                  const [ vendor, menuItems ]
                  
                  of
                  
                  Object.entries ( options )
                  
                  )
                  
                  vendorAdd (
                  
                    vendor,
                    
                    menuItems,
                    
                    element
                    
                    );
                    
                };
                
          gridInnerElement
          
            .querySelectorAll (
            
              popoverTriggerSelector
              
              )
              
            .forEach (
            
              e => e.addEventListener (
              
                'click',
                
                popoverClickHandler
                
                )
                
              );
              
          new MutationObserver (
          
            ms => ms.forEach (
            
              bodyMutationCallback
              
              )
              
            )
            
            // start listening for changes in element
            
            .observe (
            
              document.body,
              
              { childList : true }
              
              );
              
          new MutationObserver (
          
            ms => ms.forEach (
            
              gridInnerMutationCallback
              
              )
              
            )
            
            // start listening for changes in element
            
            .observe (
            
              gridInnerElement,
              
              {
              
                childList : true,
                
                subtree : true
                
                }
              
              );
              
          } ) ( );
          
        </script>
        
      <!-- end TWC Store Page Products Panel Product Menu Item Add -->

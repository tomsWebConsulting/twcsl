  <template id="twc-sppppcc" data-version="0.4.0">
  
    <script>
    
      ( ( ) => {
      
        const
        
          vendor = {
          
            text : 'TWC',
            
            url : 'https://github.com/tomsWebConsulting/twcsl#:~:text=Tom\'s Web Consulting Squarespace Library'
            
            },
            
          menuItem = {
          
            text : 'Copy Categories',
            
            productCallback : async (
            
              productId,
              
              crumb
              
              ) => {
              
                // debugger;
                
                /*
                
                  store page products panel product categories copy
                  
                  License         : < https://tinyurl.com/s872fb68 >
                  
                  Version         : 0.4.0
                  
                  SS Version      : 7.1
                  
                  Note            : this code makes a call to a JSON version of
                                    a product's data
                  
                  Copyright       : 2026 Thomas Creedon
                                    
                                    Tom's Web Consulting
                                    
                                    < http://www.tomsWeb.consulting/ >
                  
                  */
                  
                const
                
                  codeKey = 'twc-sppppcc',
                  
                  url =
                  
                    `/api/commerce/products/${
                    
                      productId
                      
                      }`;
                      
                let categories;
                
                try {
                
                  const response =
                  
                    await fetch ( url );
                    
                  if ( ! response.ok ) {
                  
                    const s = `
                    
                      ${
                      
                        codeKey
                        
                        } network response was not ok ${
                        
                          response.statusText
                          
                          }
                          
                      `
                      
                      .trim ( )
                      
                      .replace ( /\s+/gm, ' ' );
                      
                    throw new Error ( s );
                    
                    }
                    
                  categories =
                  
                    await response.json ( );
                    
                  categories = categories
                  
                    .categoryIds;
                    
                  } catch ( error ) {
                  
                    const s = `
                    
                      ${
                      
                        codeKey
                        
                        }
                        
                      there has been a problem with your
                      
                      fetch get operation, ${
                      
                        error
                        
                        }.
                        
                      `
                      
                      .trim ( )
                      
                      .replace ( /\s+/gm, ' ' );
                      
                    console.error ( s );
                    
                    }
                    
                localStorage.setItem (
                
                  codeKey,
                  
                  JSON.stringify ( categories )
                  
                  );
                  
                },
                
            url : 'https://github.com/tomsWebConsulting/twcsl/tree/main/v7.1/Page/Store/Store%20Page%20Products%20Panel%20Product%20Categories%20Copy#store-page-products-panel-product-categories-copy'
            
            };
            
        // initialize twc module
        
        window.twc = window.twc || { };
        
        // initialize twc sppppmia sub-module
        
        window.twc.sppppmia =
        
          window.twc.sppppmia || { };
          
        // initialize twc sppppmia vendor sub-module
        
        window
        
          .twc
          
          .sppppmia
          
          [ vendor.text ]
          
          =
        
          ( ( self ) => {
          
            const options = {
            
              url : vendor.url
              
              };
              
            Object
            
              .assign (
              
                self,
                
                options
                
                );
                
            return self;
            
            } )
            
          (
          
            window
            
              .twc
              
              .sppppmia
              
              [ vendor.text ]
              
            ||
            
            { }
            
            );
            
        // initialize twc sppppmia vendor menu item
        
        window
        
          .twc
          
          .sppppmia
          
          [ vendor.text ]
          
          [ menuItem.text ]
          
          =
          
          {
          
            productCallback :
            
              menuItem.productCallback,
              
            url : menuItem.url
            
            };
            
        } ) ( );
        
      </script>
      
    </template>
    
  <script>
  
    ( ( ) => {
    
      // debugger;
      
      const
      
        codeKey = 'twc-sppppcc',
        
        dcmnt = window.top.document,
        
        destinationElement =
        
          dcmnt.getElementById (
          
            `${ codeKey }`
            
            ),
            
        destinationVersion =
        
          destinationElement
          
            ?.dataset
          
            .version;
            
      let sourceElement = document
      
        .getElementById (
        
          `${ codeKey }`
          
          );
          
      const
      
        sourceVersion =
        
          sourceElement
          
            ?.dataset
            
            .version,
            
        isInstall =
        
          ! destinationElement
          
          ||
          
          destinationVersion
          
          !==
          
          sourceVersion;
          
      if ( isInstall ) {
      
        destinationElement?.remove ( );
        
        sourceElement = sourceElement
        
          .content
          
          .cloneNode ( true );
          
        sourceElement
        
          .firstElementChild
          
          .id
          
          =
          
          codeKey;
          
        sourceElement
        
          .firstElementChild
          
          .dataset
          
          .version
          
          =
          
          sourceVersion;
          
        dcmnt
        
          .head
          
          .appendChild ( sourceElement );
          
        }
        
      } ) ( );
      
    </script>
    
  <!-- end TWC Store Page Products Panel Product Menu Item Add Register -->

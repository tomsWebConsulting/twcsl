  <template id="twc-spppscp" data-version="0.3.0">
  
    <script>
    
      ( ( ) => {
      
        const
        
          vendor = {
          
            text : 'TWC',
            
            url : 'https://github.com/tomsWebConsulting/twcsl#:~:text=Tom\'s Web Consulting Squarespace Library'
            
            },
            
          menuItem = {
          
            text : 'Paste Categories',
            
            productCallback : async (
            
              productId,
              
              crumb
              
              ) => {
              
                // debugger;
                
                /*
                
                  store page products panel selected categories paste
                  
                  License         : < https://tinyurl.com/s872fb68 >
                  
                  Version         : 0.3.0
                  
                  SS Version      : 7.1
                  
                  Note            : this code makes a call to a JSON version of
                                    a product's data
                  
                  Copyright       : 2026 Thomas Creedon
                                    
                                    Tom's Web Consulting
                                    
                                    < http://www.tomsWeb.consulting/ >
                  
                  */
                  
                let categories = JSON.parse (
                
                  localStorage
                  
                    .getItem ( 'twc-sppppcc' )
                    
                  );
                  
                const isCategories =
                
                  Array.isArray ( categories )
                  
                  &&
                  
                  categories?.length !== 0;
                  
                // bail if no categories
                
                if ( ! isCategories ) return;
                
                // categories
                
                {
                
                  const prefix =
                  
                    'categoryIds=';
                    
                  categories = prefix
                  
                    +
                    
                    categories.join (
                    
                      `&${ prefix }`
                      
                      );
                      
                  }
                  
                const
                
                  codeKey = 'twc-spppscp',
                  
                  url =
                  
                    `/api/commerce/products/${
                    
                      productId
                      
                      }/categories/assign?${
                      
                        categories
                        
                        }`;
                        
                try {
                
                  const response =
                  
                    await fetch (
                    
                      url,
                      
                      {
                      
                        body : categories,
                        
                        headers : {
                        
                          'Accept' :
                          
                            'application/json, '
                            
                            +
                            
                            'text/plain, */*',
                            
                          'X-Csrf-Token' : crumb
                          
                          },
                          
                        method : 'POST'
                        
                        }
                        
                      );
                      
                  if ( ! response.ok ) {
                  
                    const s = `
                    
                      ${
                      
                        codeKey
                        
                        } network response was not ok ${
                        
                          response.statusText
                          
                          }
                          
                      `
                      
                      .trim ( )
                      
                      .replace ( /\s+/gm, ' ' );
                      
                    throw new Error ( s );
                    
                    }
                    
                  } catch ( error ) {
                  
                    const s = `
                    
                      ${
                      
                        codeKey
                        
                        }
                        
                      there has been a problem with your
                      
                      fetch post operation, ${
                      
                        error
                        
                        }.
                        
                      `
                      
                      .trim ( )
                      
                      .replace ( /\s+/gm, ' ' );
                      
                    console.error ( s );
                    
                    }
                    
                return true;
                
                },
                
            dialogTitle : 'Store Page Products Panel Selected Categories Paste',
            
            url : 'https://github.com/tomsWebConsulting/twcsl/tree/main/v7.1/Page/Store/Store Page Products Panel Selected Categories Paste#store-page-products-panel-selected-categories-paste'
            
            };
            
        /* do not change anything below, there be the borg here */
        
        // initialize twc module
        
        window.twc = window.twc || { };
        
        // initialize twc spppmpmia sub-module
        
        window.twc.spppmpmia =
        
          window.twc.spppmpmia || { };
          
        // initialize twc spppmpmia vendor sub-module
        
        window
        
          .twc
          
          .spppmpmia
          
          [ vendor.text ]
          
          =
        
          ( ( self ) => {
          
            const options = {
            
              url : vendor.url
              
              };
              
            Object
            
              .assign (
              
                self,
                
                options
                
                );
                
            return self;
            
            } )
            
          (
          
            window
            
              .twc
              
              .spppmpmia
              
              [ vendor.text ]
              
            ||
            
            { }
            
            );
            
        // initialize twc spppmpmia vendor menu item
        
        window
        
          .twc
          
          .spppmpmia
          
          [ vendor.text ]
          
          [ menuItem.text ]
          
          =
          
          {
          
            productCallback :
            
              menuItem.productCallback,
              
            dialogTitle :
            
              menuItem.dialogTitle,
              
            url : menuItem.url
            
            };
            
        } ) ( );
        
      </script>
      
    </template>
    
  <script>
  
    ( ( ) => {
    
      // debugger;
      
      const
      
        codeKey = 'twc-spppscp',
        
        dcmnt = window.top.document,
        
        destinationElement =
        
          dcmnt.getElementById (
          
            `${ codeKey }`
            
            ),
            
        destinationVersion =
        
          destinationElement
          
            ?.dataset
          
            .version;
            
      let sourceElement = document
      
        .getElementById (
        
          `${ codeKey }`
          
          );
          
      const
      
        sourceVersion =
        
          sourceElement
          
            ?.dataset
            
            .version,
            
        isInstall =
        
          ! destinationElement
          
          ||
          
          destinationVersion
          
          !==
          
          sourceVersion;
          
      if ( isInstall ) {
      
        destinationElement?.remove ( );
        
        sourceElement = sourceElement
        
          .content
          
          .cloneNode ( true );
          
        sourceElement
        
          .firstElementChild
          
          .id
          
          =
          
          codeKey;
          
        sourceElement
        
          .firstElementChild
          
          .dataset
          
          .version
          
          =
          
          sourceVersion;
          
        dcmnt
        
          .head
          
          .appendChild ( sourceElement );
          
        }
        
      } ) ( );
      
    </script>
    
  <!--
  
    end TWC Store Page Products Panel Multiple Products Menu Item Add Register
    
    -->

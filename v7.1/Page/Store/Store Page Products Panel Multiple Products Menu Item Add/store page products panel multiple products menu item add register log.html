  <template id="twc-spppmpmiarl" data-version="0.2.0">
  
    <script>
    
      ( ( ) => {
      
        const
        
          vendor = {
          
            text : 'TWC',
            
            url : 'https://github.com/tomsWebConsulting/twcsl#:~:text=Tom\'s Web Consulting Squarespace Library'
            
            },
            
          menuItem = {
          
            text : 'SPPPMPMIAR Log',
            
            productCallback : async (
            
              productId,
              
              crumb
              
              ) => {
              
                /*
                
                  spppmpmiar log
                  
                  License         : < https://tinyurl.com/s872fb68 >
                  
                  Version         : 0.2.0
                  
                  SS Version      : 7.1
                  
                  Copyright       : 2026 Thomas Creedon

                                    < http://www.tomsWeb.consulting/ >
                  
                  */
                  
                console.log (
                
                  'twc-spppmpmiarl product id :',
                  
                  productId
                  
                  );
                  
                return true;
                
                },
                
            dialogTitle : 'Store Page Products Panel Multiple Products Menu Item Add Register Log',
            
            url : '[ optional, enter menu item url here between single quotes replacing square brackets ]'
            
            };
            
        // initialize twc module
        
        window.twc = window.twc || { };
        
        // initialize twc spppmpmia sub-module
        
        window.twc.spppmpmia =
        
          window.twc.spppmpmia || { };
          
        // initialize twc spppmpmia vendor sub-module
        
        window
        
          .twc
          
          .spppmpmia
          
          [ vendor.text ]
          
          =
        
          ( ( self ) => {
          
            const options = {
            
              url : vendor.url
              
              };
              
            Object
            
              .assign (
              
                self,
                
                options
                
                );
                
            return self;
            
            } )
            
          (
          
            window
            
              .twc
              
              .spppmpmia
              
              [ vendor.text ]
              
            ||
            
            { }
            
            );
            
        // initialize twc spppmpmia vendor menu item
        
        window
        
          .twc
          
          .spppmpmia
          
          [ vendor.text ]
          
          [ menuItem.text ]
          
          =
          
          {
          
            productCallback :
            
              menuItem.productCallback,
              
            dialogTitle :
            
              menuItem.dialogTitle,
              
            url : menuItem.url
            
            };
            
        } ) ( );

    </template>
    
  <script>
  
    ( ( ) => {
    
      // debugger;
      
      const
      
        codeKey = 'twc-spppmpmiarl',
        
        dcmnt = window.top.document,
        
        destinationElement =
        
          dcmnt.getElementById (
          
            `${ codeKey }`
            
            ),
            
        destinationVersion =
        
          destinationElement
          
            ?.dataset
          
            .version;
            
      let sourceElement = document
      
        .getElementById (
        
          `${ codeKey }`
          
          );
          
      const
      
        sourceVersion =
        
          sourceElement
          
            ?.dataset
            
            .version,
            
        isInstall =
        
          ! destinationElement
          
          ||
          
          destinationVersion
          
          !==
          
          sourceVersion;
          
      if ( isInstall ) {
      
        destinationElement?.remove ( );
        
        sourceElement = sourceElement
        
          .content
          
          .cloneNode ( true );
          
        sourceElement
        
          .firstElementChild
          
          .id
          
          =
          
          codeKey;
          
        sourceElement
        
          .firstElementChild
          
          .dataset
          
          .version
          
          =
          
          sourceVersion;
          
        dcmnt
        
          .head
          
          .appendChild ( sourceElement );
          
        }
        
      } ) ( );
      
    </script>

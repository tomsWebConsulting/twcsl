  <script>
  
    ( ( ) => {
    
      // debugger;
      
      /*
      
        page section first css variable padding-top add
        
        License         : < https://tinyurl.com/s872fb68 >
        
        Version         : 0.3.0

        no user serviceable parts below
        
        */
        
      const
      
        title = 'Page Section First CSS Variable Padding-Top Add',
        
        version = '0.3.0',
        
        s = `
        
          ${ title } v${ version }
          
          License < https://tinyurl.com/s872fb68 >
          
          © 2022-2026 Thomas Creedon
          
          Tom's Web Consulting < http://www.tomsWeb.consulting >
          
          `
          
          .replace ( /^\s+/gm, '' );
          
      console.log ( s );
      
      const
      
        attribute = 'style',
        
        codeKey = 'twc-psfcvpta',
        
        getPaddingTop = ( ) => {
        
          const paddingTop =
          
            getComputedStyle (
            
              document
              
                .body
                
                .querySelector (
                
                  '#page '
                  
                  +
                  
                  '.page-section:first-child'
                  
                  )
                  
              )
              
              .getPropertyValue (
              
                'padding-top'
                
                );
                
          return paddingTop;
          
          },
          
        setCssVariable = ( paddingTop ) => {
        
          document
          
            .querySelector ( ':root' )
          
            .style
            
            .setProperty (
            
              `--${ codeKey }`,
              
              paddingTop
              
              );
              
          },
          
        mutationCallback = ( mutation ) => {
        
          const isTypeAttributes =
          
            mutation.type
            
            ===
            
            'attributes';
            
          // continue if not attribute
          
          if ( ! isTypeAttributes ) return;
          
          const isAttributeNameStyle =
          
            mutation.attributeName
            
            ===
            
            attribute
            
          // continue if not style
          
          if ( ! isAttributeNameStyle )
          
            return;
            
          setCssVariable (
          
            getPaddingTop ( )
            
            );
            
          },
          
        domContentLoadedCallback = ( ) => {
        
          setCssVariable (
          
            getPaddingTop ( )
            
            );
            
          new MutationObserver (
          
            ms => ms.forEach (
            
              m => mutationCallback ( m )
              
              )
              
            )
            
            // start listening for changes in element
            
            .observe (
            
              document
              
                .body
                
                .querySelector (
                
                  '#page-regions '
                  
                  +
                  
                  '.page-section:first-child'
                  
                  ),
                  
              {
          
                attributeFilter : [ attribute ],
                
                childList : true
                
                }
                  
              );
              
            };
            
      // domContentLoadedCallback ( );
      
      //
      
      document.addEventListener (
      
        'DOMContentLoaded',
        
        domContentLoadedCallback
        
        );
        
      //
      
      } ) ( );
      
    </script>
    
  <!-- end TWC Page Section First CSS Variable Padding-Top Add -->

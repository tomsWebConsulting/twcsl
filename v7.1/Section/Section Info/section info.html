  <template id="twc-si-template">
  
    <template id="twc-si-info-template">
    
      <div class="twc-si-info">
      
        <div class="twc-si-title">
        
          Info
          
          </div>
          
        <table class="twc-si-data">
        
          <tbody>
          
            <tr class="twc-si-item twc-si-data-editor">
            
              <td class="twc-si-data-title">
              
                Editor
                
                </td>
                
              <td class="twc-si-separator">
              
                :
                
                </td>
                
              <td class="twc-si-data-data">
              
                </td>
                
              </tr>
              
            <tr class="twc-si-item twc-si-data-type">
            
              <td class="twc-si-data-title">
              
                Type
                
                </td>
                
              <td class="twc-si-separator">
              
                :
                
                </td>
                
              <td class="twc-si-data-data">
              
                </td>
                
              </tr>
              
            <tr class="twc-si-item twc-si-data-blocks-number">
            
              <td class="twc-si-data-title">
              
                Blocks
                
                </td>
                
              <td class="twc-si-separator">
              
                :
                
                </td>
                
              <td class="twc-si-data-data">
              
                </td>
                
              </tr>
              
            </tbody>
            
          </table>
          
        </div>
        
      </template>
      
    <style id="twc-si-style">
    
      .twc-si-info {
      
        -webkit-box-sizing : border-box;
        box-sizing : border-box;
        
        border : 1px solid rgb( 231, 231, 231 );
        border-radius : 4px;
        
        display : -webkit-box;
        display : -ms-flexbox;
        display : flex;
        
        -webkit-box-orient : vertical;
        -webkit-box-direction : normal;
        -ms-flex-direction : column;
        flex-direction : column;
        
        gap : 4px;
        padding : 4px;
        
        }
        
      .twc-si-title {
      
        font-size : smaller;
        font-weight : bold;
        text-align : center;
        text-transform : uppercase;
        width : 100%;
        
        }
        
      .twc-si-data {
      
        padding : 10px 8px;
        
        td {
        
          vertical-align : top;
          
          }
          
        }
        
      .twc-si-data-title {
      
        font-weight : bold;
        width : 1%;
        
        }
        
      .twc-si-separator {
      
        padding : 0 0.5em;
        
        }
        
      .twc-si-hide {
      
        display : none;
        
        }
        
      </style>
      
    <script id="twc-si-script">
    
      ( ( ) => {
      
        // debugger;
        
        // globals
        
        {
        
          // initialize twc module
          
          window.twc = window.twc || { };
          
          // initialize twc si sub-module
          
          twc.si = twc.si || { };
          
          }
          
        const
        
          attribute = 'class',
          
          blockCountInfoAdd = (
          
            infoElement,
            
            pageSectionElement,
            
            sectionClasses
            
            ) => {
            
              const
              
                blockCount = [
                
                  ...
                  
                  pageSectionElement
                  
                    .querySelectorAll (
                    
                      [
                      
                        '[ data-sqsp-block ]',
                        
                        '.sqs-block'
                        
                        ]
                        
                        .join ( ', ' )
                        
                      )
                      
                  ]
                  
                  .filter (
                  
                    e => ! e.closest (
                    
                      '.sqs-block-remover'
                      
                      )
                      
                    )
                    
                  .length,
                  
                element = infoElement
                
                  .querySelector (
                  
                    `.${
                    
                      codeKey
                      
                      }-data-blocks-number`
                      
                    );
                    
              if ( blockCount ) {
              
                element
                
                  .classList
                  
                  .remove (
                  
                    `${ codeKey }-hide`
                    
                    );
                    
                element
                
                  .querySelector (
                  
                    `.${
                    
                      codeKey
                      
                      }-data-data`
                      
                    )
                  
                  .textContent
                  
                  =
                  
                  blockCount;
                  
                } else
                
                  element
                  
                    .classList
                    
                    .add ( `${ codeKey }-hide` );
                    
            },
            
          codeKey = 'twc-si',
          
          dcmnt = document
          
            .querySelector (
            
              'iframe[ data-testid = "sqs-site-frame" ]'
              
              )
              
            .contentDocument,
            
          hideClassName = `${ codeKey }-hide`,
          
          editorInfoAdd = (
          
            infoElement,
            
            pageSectionElement,
            
            dcmntBodyElementClasses,
            
            sectionClasses
            
            ) => {
            
              let element = infoElement
              
                .querySelector (
                
                  `.${ codeKey }-data-editor`
                  
                  );
                
              const
              
                isClassicEditor =
                
                  pageSectionElement
                  
                    .dataset
                    
                    .sqspSection
                    
                    ===
                    
                    'classic-editor'
                    
                  ||
                  
                  (
                  
                    dcmntBodyElementClasses
                    
                      .contains (
                      
                        'view-item'
                        
                        )
                        
                    &&
                    
                    [
                    
                      'blog-item',
                      
                      'events-item'
                      
                      ]
                      
                      .includes (
                      
                        pageSectionElement
                        
                          .dataset
                          
                          .sqspSection
                          
                        )
                        
                    ),
                    
                isFluidEngine =
                
                  pageSectionElement
                  
                    .dataset
                    
                    .sqspSection
                    
                    ===
                    
                    'fluid-engine';
                    
              const isUserLayoutSection =
              
                isFluidEngine
                
                ||
                
                isClassicEditor;
              
              if ( isUserLayoutSection ) {
              
                element
                
                  .classList
                  
                  .remove ( hideClassName );
                  
                element
                
                  .querySelector (
                  
                    `.${ codeKey }-data-data`
                    
                    )
                    
                  .textContent
                  
                  =
                  
                  isFluidEngine
                  
                  ?
                  
                  'Fluid Engine'
                  
                  :
                  
                  'Classic Editor';
                  
                } else
                
                  element
                  
                    .classList
                    
                    .add ( hideClassName );
                    
            },
            
          typeInfoAdd = (
          
            infoElement,
            
            pageSectionElement,
            
            dcmntBodyElementClasses,
            
            sectionClasses
            
            ) => {
            
              const
              
                element = infoElement
                
                  .querySelector (
                  
                    `.${ codeKey }-data-type`
                    
                    ),
                    
                isItem =
                
                  dcmntBodyElementClasses
                  
                    .contains (
                    
                      'view-item'
                      
                      ),
                      
                isList =
                
                  dcmntBodyElementClasses
                  
                    .contains (
                    
                      'view-list'
                      
                      ),
                      
                isAutoLayout = sectionClasses
                
                  .contains (
                  
                    'user-items-list-section'
                    
                    ),
                    
                isBlank = sectionClasses
                
                  .contains (
                  
                    'layout-engine-section'
                    
                    ),
                    
                isBlogList =
                
                  isList
                  
                  &&
                  
                  pageSectionElement
                  
                    .dataset
                    
                    .sqspSection
                    
                    ===
                    
                    'blog-list',
                    
                isBlogPost =
                
                  isItem
                  
                  &&
                  
                  pageSectionElement
                  
                    .dataset
                    
                    .sqspSection
                    
                    ===
                    
                    'blog-item',
                    
                isCourse =
                
                  isItem
                  
                  &&
                  
                  pageSectionElement
                  
                    .dataset
                    
                    .sqspSection
                    
                    ===
                    
                    'course-item',
                    
                isCourseList =
                
                  isList
                  
                  &&
                  
                  pageSectionElement
                  
                    .dataset
                    
                    .sqspSection
                    
                    ===
                    
                    'course-list',
                    
                isEvent =
                
                  isItem
                  
                  &&
                  
                  pageSectionElement
                  
                    .dataset
                    
                    .sqspSection
                    
                    ===
                    
                    'events-item',
                    
                isEvents =
                
                  isList
                  
                  &&
                  
                  pageSectionElement
                  
                    .dataset
                    
                    .sqspSection
                    
                    ===
                    
                    'events-list',
                    
                isGallery = sectionClasses
                
                  .contains (
                  
                    'gallery-section'
                    
                    ),
                    
                isPortfolio =
                
                  pageSectionElement
                  
                    .dataset
                    
                    .sqspSection
                    
                    ===
                    
                    'portfolio-list',
                    
                isStoreDetail =
                
                  pageSectionElement
                  
                    .dataset
                    
                    .sqspSection
                    
                    ===
                    
                    'product-detail',
                    
                isStoreList =
                
                  pageSectionElement
                  
                    .dataset
                    
                    .sqspSection
                    
                    ===
                    
                    'product-list',
                    
                isVideo = sectionClasses
                
                  .contains (
                  
                    'lessons-item-section'
                    
                    ),
                    
                isVideos =
                
                  !!
                  
                  pageSectionElement
                  
                    .querySelector (
                    
                      '#video-gallery-main-content'
                      
                      );
                    
              let type;
              
              switch ( true ) {
              
                case isAutoLayout :
                
                  type = 'Auto Layout';
                  
                  break;
                  
                case isBlank :
                
                  type = 'Blank';
                  
                  break;
                  
                case isBlogList :
                
                  type = 'Blog';
                  
                  break;
                  
                case isBlogPost :
                
                  type = 'Blog Post';
                  
                  break;
                  
                case isCourse :
                
                  type = 'Course';
                  
                  break;
                  
                case isCourseList :
                
                  type = 'Course Overview';
                  
                  break;
                  
                case isEvent :
                
                  type = 'Event';
                  
                  break;
                  
                case isEvents :
                
                  type = 'Events';
                  
                  break;
                  
                case isGallery :
                
                  type = 'Gallery';
                  
                  break;
                  
                case isPortfolio :
                
                  type = 'Portfolio';
                  
                  break;
                  
                case isStoreDetail :
                
                  type = 'Store Product Detail';
                  
                  break;
                  
                case isStoreList :
                
                  type = 'Store';
                  
                  break;
                  
                case isVideo :
                
                  type = 'Video';
                  
                  break;
                  
                case isVideos :
                
                  type = 'Videos';
                  
                  break;
                  
                }
                
              if ( type ) {
              
                element
                
                  .classList
                  
                  .remove ( hideClassName );
                  
                element
                
                  .querySelector (
                  
                    `.${ codeKey }-data-data`
                    
                    )
                    
                  .textContent
                  
                  =
                  
                  type;
                  
                } else
                
                  element
                  
                    .classList
                    
                    .add ( hideClassName );
                    
              },
              
          mutationCallback =
          
            ( mutation ) => {
            
              const isAttribute =
              
                mutation.attributeName
                
                ===
                
                attribute;
                
              // bail if not attribute
              
              if ( ! isAttribute ) return;
              
              const
              
                target = mutation.target,
                
                hasToolbar = target
                
                  .classList
                  
                  .contains (
                  
                    'show-toolbar'
                    
                    );
                    
              // bail if no toolbar
              
              if ( ! hasToolbar ) return;
              
              const
              
                toolbarElement = target
                
                  .querySelector (
                  
                    '.js-section-toolbar'
                    
                    );
                    
              // bail if no toolbar element
              
              if ( ! toolbarElement ) return;
              
              const
              
                dataSectionId = target
                
                  .closest (
                  
                    '.js-section-editor-ui-container'
                    
                    )
                  
                  .getAttribute (
                  
                    'data-section-id'
                    
                    ),
                    
                dcmntBodyElementClasses = [
                
                  ...
                  
                  dcmnt
                  
                    .body
                    
                    .classList
                    
                  ],
                  
                pageSectionElement = dcmnt
                
                  .body
                  
                  .querySelector (
                  
                    `[ data-section-id = "${
                    
                      dataSectionId
                      
                      }" ]`
                      
                    ),
                    
                sectionClasses = [
                
                  ...
                  
                  pageSectionElement
                  
                    .classList
                    
                  ];
                  
              let infoElement =
              
                toolbarElement
                  
                  .querySelector (
                  
                    `.${ codeKey }-info`
                    
                    );
                    
              if ( ! infoElement ) {
              
                infoElement = document
                
                  .getElementById (
                  
                    `${
                    
                      codeKey
                      
                      }-info-template`
                      
                    )
                    
                  .content
                  
                  .firstElementChild
                  
                  .cloneNode ( true );
                  
                toolbarElement
                
                  .appendChild (
                  
                    infoElement
                    
                    );
                    
                }
                
              editorInfoAdd (
              
                infoElement,
                
                pageSectionElement,
                
                dcmntBodyElementClasses,
                
                sectionClasses
                
                );
                
              typeInfoAdd (
              
                infoElement,
                
                pageSectionElement,
                
                dcmntBodyElementClasses,
                
                sectionClasses
                
                );
                
              blockCountInfoAdd (
              
                infoElement,
                
                pageSectionElement
                
                );
                
              };
              
        twc
        
          .si
          
          .observer
          
          =
          
          new MutationObserver (
          
            ms => ms.forEach (
            
              mutationCallback
              
              )
              
            );
            
        // start listening for changes in element
        
        twc
        
          .si
          
          .observer
          
          .observe (
          
            document.body,
            
            {
            
              attributeFilter : [
              
                attribute
                
                ],
                
              attributeOldValue : true,
              
              childList : true,
              
              subtree : true
              
              }
              
            );
            
        } ) ( );
        
      </script>
      
    </template>
    
  <script>
  
    ( ( ) => {
    
      // debugger;
      
      const
      
        title = 'Section Info',
        
        version = '0.3.3-development.3',
      
        s = `
        
          ${ title } v${ version }
        
          License < https://tinyurl.com/s872fb68 >
          
          © 2022-2026 Thomas Creedon
          
          Tom's Web Consulting < http://www.tomsWeb.consulting >
          
          `
          
          .replace ( /^\s+/gm, '' );
          
      console.log ( s );
      
      const
      
        codeKey = 'twc-si',
        
        wndw = window.top,
        
        dcmnt = wndw.document;
        
      // delete
      
      {
      
        wndw
        
          ?.twc
          
          ?.si
          
          ?.observer
          
          ?.disconnect ( );
          
        delete wndw
        
          ?.twc
          
          ?.si
          
          ?.observer;
          
        dcmnt
        
          .querySelectorAll (
          
            `[ id ^= "${ codeKey }-" ]`
            
            )
            
          .forEach (
          
            e => e?.remove ( )
            
            );
            
        }
        
      dcmnt
      
        .head
        
        .appendChild (
        
          document
          
            .getElementById (
            
              `${ codeKey }-template`
              
              )
              
            .content
            
            .cloneNode ( true )
            
          );
          
      } ) ( );
      
    </script>
    
  <!-- end TWC Section Info -->

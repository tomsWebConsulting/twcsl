  <template id="twc-almtdm-template">
  
    <script id="twc-almtdm">
    
      ( ( ) => {
      
        // debugger;
        
        // globals
        
        {
        
          // initialize twc module
          
          window.twc = window.twc || { };
          
          // initialize twc almtdm sub-module
          
          twc.almtdm = twc.almtdm || { };
          
          }
          
        const
        
          codeKey = 'twc-almtdm',
          
          global = codeKey
          
            .split ( '-' )
            
            .reduce (
            
              ( obj, key ) => obj?.[ key ],
              
              window
              
              ),
              
          mutationCallback =
          
            ( mutation ) => {
            
              let element =
              
                mutation.addedNodes [ 0 ];
                
              // bail if no element
              
              if ( ! element ) return;
              
              element = element
              
                .querySelector (
                
                  '#move-to-modal-title'
                  
                  )
                  
                ?.parentElement;
                
              // bail if no element
              
              if ( ! element ) return;
              
              element.insertAdjacentHTML (
              
                'afterbegin',
                
                `
                
                  <div id="${ codeKey }">
                  
                    </div>
                    
                  `
                  
                );
                
              const wrapperElement = element
              
                .querySelector (
                
                  `#${ codeKey }`
                  
                  );
                  
              [
              
                ...
                
                element.children
                
                ]
                
                .forEach ( e => {
                
                  const isMatch =
                  
                    e === wrapperElement;
                    
                  // bail if is match
                  
                  if ( isMatch ) return;
                  
                  wrapperElement
                  
                    .appendChild ( e );
                    
                  } );
                  
              element =
              
                element.parentElement;
                
              let
              
                startX,
                
                startY,
                
                tx = 0,
                
                ty = 0;
                  
              const
              
                move = ( event ) => {
                
                  tx +=
                  
                    event.clientX - startX;
                    
                  ty +=
                  
                    event.clientY - startY;
                    
                  startX = event.clientX;
                  
                  startY = event.clientY;
                  
                  element
                  
                    .style
                    
                    .transform
                    
                    =
                    
                    `translate( ${
                    
                      tx
                      
                      }px, ${
                      
                        ty
                        
                        }px )`;
                        
                  const rect = element
                  
                    .getBoundingClientRect ( );
                    
                  if ( rect.left < 0 )
                  
                    tx -= rect.left;
                    
                  if (
                  
                    rect.right
                    
                    >
                    
                    window.innerWidth
                    
                    )
                    
                    tx -=
                    
                      rect.right
                      
                      -
                      
                      window.innerWidth;
                      
                  if ( rect.top < 0 )
                  
                    ty -= rect.top;
                    
                  if (
                  
                    rect.bottom
                    
                    >
                    
                    window.innerHeight
                    
                    )
                    
                    ty -=
                    
                      rect.bottom
                      
                      -
                      
                      window.innerHeight;
                      
                  },
                  
                stop = ( ) => {
                
                  window
                  
                    .removeEventListener (
                    
                      'pointermove',
                      
                      move
                      
                      ),
                      
                  window
                  
                    .removeEventListener (
                    
                      'pointerup',
                      
                      stop
                      
                      );
                      
                  };
                  
              element.addEventListener (
              
                'pointerdown',
                
                e => {
                
                  const isWrapper = e
                  
                    .target
                    
                    .closest (
                    
                      `#${ codeKey }`
                      
                      );
                      
                  if ( isWrapper )
                  
                    return;
                    
                  startX = e.clientX;
                  
                  startY = e.clientY;
                  
                  window.addEventListener (
                  
                    'pointermove',
                    
                    move
                    
                    );
                    
                  window.addEventListener (
                  
                    'pointerup',
                    
                    stop
                    
                    );
                    
                  }
                  
                );
              
              };
              
        global.observer =
        
          new MutationObserver (
          
            ms => ms.forEach (
            
              mutationCallback
              
              )
              
            );
            
        // start listening for changes in element
        
        global
        
          .observer
          
          .observe (
          
            document.body,
            
            { childList : true }
            
            );
            
        } ) ( );
        
      </script>
      
    </template>
    
  <script>
  
    ( ( ) => {
    
      // debugger;
      
      const
      
        title = 'Asset Library Move to Dialog Move',
        
        version = '0.2.0',
      
        s = `
        
          ${ title } v${ version }
        
          License < https://tinyurl.com/s872fb68 >
          
          © 2026 Thomas Creedon
          
          Tom's Web Consulting < http://www.tomsWeb.consulting >
          
          `
          
          .replace ( /^\s+/gm, '' );
          
      console.log ( s );
      
      const
      
        codeKey = 'twc-almtdm',
        
        wndw = window.top,
        
        dcmnt = wndw.document,
        
        global = codeKey
        
          .split ( '-' )
          
          .reduce (
          
            ( obj, key ) => obj?.[ key ],
            
            wndw
            
            );
            
      // delete
      
      {
      
        global
        
          ?.observer
          
          ?.disconnect ( );
          
        delete global?.observer;
        
        dcmnt
        
          .getElementById (
          
            `${ codeKey }`
            
            )
            
          ?.remove ( );
          
        }
        
      dcmnt
      
        .head
        
        .appendChild (
        
          document
          
            .getElementById (
            
              `${ codeKey }-template`
              
              )
              
            .content
            
            .cloneNode ( true )
            
          );
          
      } ) ( );
      
    </script>

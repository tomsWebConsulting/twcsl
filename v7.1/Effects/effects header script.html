  <script id="twc-e-script">
  
    ( ( ) => {
    
      // debugger;
      
      const
      
        title = 'Effects',
        
        version = '0.1.0-development.0',
        
        s = `${ title } v${ version }
        
          License < https://tinyurl.com/s872fb68 >
          
          © 2026 Thomas Creedon
          
          Tom's Web Consulting < http://www.tomsWeb.consulting >`
          
          .replace ( /^\s+/gm, '' );
          
      console.log ( s );
      
      const isAuthenticatedAccount = window
        
        .Static
        
        .SQUARESPACE_CONTEXT
        
        .authenticatedAccount;
        
      // bail if not authenticated
      
      if ( ! isAuthenticatedAccount )
      
        return;
        
      const codeKey = 'twc-e';
      
      // globals
      
      {
      
        // initialize twc module
        
        window.twc = window.twc || { };
        
        // initialize twc e sub-module
        
        twc.e = twc.e || { };
        
        // initialize twc e methods sub-module
        
        twc.e.methods = twc.e.methods || { };
        
        // initialize twc e methods fetch
        
        twc.e.methods.fetch = async (
        
          url,
          
          type
          
          ) => {
          
            let data;
            
            try {
            
              const response =
              
                await fetch ( url );
                
              if ( ! response.ok ) {
              
                const s = `
                
                  ${
                  
                    codeKey
                    
                    } network response was not ok ${
                    
                      response.statusText
                      
                      }
                      
                  `
                  
                  .trim ( )
                  
                  .replace ( /\s+/gm, ' ' );
                  
                throw new Error ( s );
                
                }
                
              switch ( type ) {
              
                case 'json' :
                
                  data =
                  
                    await response.json ( );
                    
                  break;
                  
                case 'text' :
                
                  data =
                  
                    await response.text ( );
                    
                  break;
                  
                }
                
              } catch ( error ) {
              
                const s = `
                
                  ${
                  
                    codeKey
                    
                    } there has been a problem with your fetch get operation, ${
                    
                      error
                      
                      }.
                      
                  `
                  
                  .trim ( )
                  
                  .replace ( /\s+/gm, ' ' );
                  
                console.error ( s );
                
                }
                
            return data;
            
            };
            
        // initialize twc e methods html to fragment
        
        twc.e.methods.htmlToFragment =
        
          ( html ) => {
          
            const fragment = document
            
              .createRange ( )
              
              .createContextualFragment (
              
                html
                
                );
                
            return fragment;
            
            };
            
        // initialize twc e methods load
        
        twc.e.methods.load = async (
        
          url
          
          ) => {
          
            let fragment = await twc
            
              .e
              
              .methods
              
              .fetch ( url, 'text' );
              
            // bail if no fragment
            
            if ( ! fragment ) return;
            
            fragment = twc
            
              .e
              
              .methods
              
              .htmlToFragment ( fragment );
              
            document
            
              .head
              
              .appendChild (
              
                fragment
                
                );
                
            };
            
        }
        
      const url =
      
        `https://cdn.jsdelivr.net/gh/tomsWebConsulting/twcsl@latest/v7.1/Effects/initialize.html`;
        
      twc.e.methods.load ( url );
      
      } ) ( );
      
    </script>

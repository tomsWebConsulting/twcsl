  <style>
  
    .tweak-blog-stacked-show-time .eventlist-event--multiday .twc-bplma.eventlist-meta-date-time .event-date::after {
    
      content : ', ';
      
      }
      
    .tweak-blog-stacked-show-time .eventlist-event--multiday .twc-bplma.eventlist-meta-date .event-date::after {
    
      content : unset;
      
      }
      
    .twc-bplma {
    
      &.eventlist-meta-categories-list,
      &.eventlist-meta-tags-list
      
        {
        
           a:not( :last-child )::after {
          
            content : ', ';
            
            }
            
          }
          
      }
      
    </style>
    
  <script>
  
    ( ( ) => {
    
      // initialize twc module
      
      window.twc = window.twc || { };
      
      // initialize twc bplma sub-module
      
      twc.bplma = ( ( self ) => {
      
        const options = {
        
          metaAdd : {
          
            /*
            
              value is categories, date, date dow, date time, date time updated,
              date updated, location, tags, time, time updated
              
              date dow : shows the day of week name
              
              */
              
            tertiary : '[ add value here between single quotes replacing square brackets ]',
            
            quaternary : '[ optional, add value here between single quotes replacing square brackets ]',
            
            quinary : '[ optional, add value here between single quotes replacing square brackets ]',
            
            senary : '[ optional, add value here between single quotes replacing square brackets ]',
            
            septenary : '[ optional, add value here between single quotes replacing square brackets ]',
            
            octonary : '[ optional, add value here between single quotes replacing square brackets ]',
            
            nonary : '[ optional, add value here between single quotes replacing square brackets ]',
            
            denary : '[ optional, add value here between single quotes replacing square brackets ]',
            
            undenary : '[ optional, add value here between single quotes replacing square brackets ]',
            
            duodenary : '[ optional, add value here between single quotes replacing square brackets ]'
            
            }
            
          };
          
        Object
        
          .assign (
          
            self,
            
            options
            
            );
            
        return self;
        
        } ) ( twc.bplma || { } );
        
      } ) ( );
      
    </script>

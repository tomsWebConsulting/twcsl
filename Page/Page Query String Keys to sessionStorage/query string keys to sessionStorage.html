  <script>
  
    ( ( ) => {
    
      // debugger;
      
      /*

      const
      
        title = 'Page Query String Keys to sessionStorage',
        
        version = '0.1.0',
        
        s = `
        
          ${ title } v${ version }
          
          License < https://tinyurl.com/s872fb68 >
          
          © 2026 Thomas Creedon
          
          Tom's Web Consulting < http://www.tomsWeb.consulting >
          
          `
          
          .replace ( /^\s+/gm, '' );
          
      console.log ( s );
      
      const domContentLoadedCallback =
      
        ( ) => {
        
          // globals
          
          {
          
            // initialize twc module
            
            window.twc = window.twc || { };
            
            // initialize twc qskts sub-module
            
            twc.qskts = twc.qskts || { };
            
            }
            
          const
          
            codeKey = 'twc-qskts',
            
            options = codeKey
            
              .split ( '-' )
              
              .reduce (
              
                ( obj, key ) =>
                
                  obj?.[ key ],
                  
                window
                
                ),
                
            searchParams =
            
              new URLSearchParams (
              
                location.search
                
                );
              
          options
          
            .whitelist
            
            .forEach ( k => {
            
              const value =
              
                searchParams.get ( k );
                
              // continue
              
              if ( ! value ) return;
              
              sessionStorage.setItem (
              
                `${ codeKey }-${ k }`,
                
                value
                
                );
                
              } );
              
          };
          
      // domContentLoadedCallback ( );
      
      //
      
      document.addEventListener (
      
        'DOMContentLoaded',
        
        domContentLoadedCallback
        
        );
        
      //
      
      } ) ( );
      
    </script>
  
  <!-- end TWC Page Query String Keys to sessionStorage -->
